services:
  mysql:
    image: mysql:8.4
    container_name: wiki-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: wiki_relacionamento
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p'${DB_PASSWORD}' -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: wiki-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: '${APP_KEY}'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wiki_relacionamento
      DB_USERNAME: root
      DB_PASSWORD: '${DB_PASSWORD}'
    ports:
      - "9191:80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: wiki-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5175:80"

volumes:
  mysql_data:
